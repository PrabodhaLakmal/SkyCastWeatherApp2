<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>SkyCast</title>
  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="page">

```
<!-- Header -->


<!-- Main Content -->
<main>

  <!-- Hero / Search Section -->
<section class="hero">

  <h2>Check the weather anywhere</h2>
  <p class="subtitle">Search any city for current weather and a 5-day forecast.</p>


  <div class="search-row">

    <input
      type="text"
      id="cityInput"
      placeholder="Enter a city, e.g. Colombo"
    />


    <button id="searchBtn">Search</button>

  </div>

  <p id="statusMsg" class="status"></p>

</section>



  <!-- Current Weather -->
  <section id="currentCard" class="current-card hidden">

  <h2 id="cityName">—</h2>


  <div class="current-grid">

    <div class="stat">
      <span class="stat-label">Temperature</span>

      <span class="stat-value" id="temp">—</span>

    </div>


    <div class="stat">
      <span class="stat-label">Wind Speed</span>

      <span class="stat-value" id="wind">—</span>

    </div>


    <div class="stat">
      <span class="stat-label">Condition</span>

      <span class="stat-value" id="condition">—</span>

    </div>

  </div>

</section>



  <!-- Forecast -->
  <section class="forecast-section">

  <div class="section-heading">

    <div>

      <h2>5-Day Forecast</h2>

      <p>Upcoming weather conditions</p>

    </div>

    <span class="forecast-icon">📅</span>

  </div>


  <div class="table-wrapper">

    <table>

      <thead>
        <tr>

          <th>Date</th>
          <th>Condition</th>
          <th>Max °C</th>
          <th>Min °C</th>
          <th>Precipitation (mm)</th>

        </tr>
      </thead>

      <tbody id="forecastBody"></tbody>


    </table>

  </div>

</section>


</main>


<!-- Footer -->


```

  </div>

  <script src="script.js"></script>

</body>
</html>
